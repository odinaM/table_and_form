<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="header">
            <ul class="header-list">
                <li class="list-item">НашСайт</li>
                <li class="list-item">Характеристики</li>
                <li class="list-item">Контакты</li>
                <li class="list-img"><img src="img/logo.svg" alt="logo"></li>
            </ul>
        </div>
    </header>
<main>
    <div class="white-border">
        <p>Узнать цену и забронировать машину</p>
        <div class="pink-block">
            <form action="#">
                <div class="first-row">
                    <input type="text" placeholder="Ваше имя" required>
                    <input type="email" placeholder="Ваше email" required>
                    <input type="tel" placeholder="Ваш номер" required>
                </div>
                <div class="second-row">
                    <select>
                        <option value="0">Какой автомобиль</option>
                        <option value="1">Автомобиль 1</option>
                        <option value="2">Автомобиль 2</option>
                        <option value="3">Автомобиль 3</option>
                        <option value="4">Автомобиль 4</option>
                        <option value="5">Автомобиль 5</option>
                    </select>
                    <input type="text" placeholder="Дата бронирования" required>
                    <input type="text" placeholder="На сколько" required>
                </div>
                <div class="third-row">
                    <textarea placeholder="Дополнительный текст"></textarea>
                </div>
                <button type="submit">Узнать цену</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
